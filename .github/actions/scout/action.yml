name: Scout
description: Install a pinned, sha256-verified Scout release and run a differential (pull request) or full (trusted) assessment.

inputs:
  scout-version:
    description: Release tag of Scout (for example v0.1.0)
    required: true
  release-repo:
    description: owner/name of the repository publishing Scout releases
    required: false
    default: adam-jackson-cf/scout
  mode:
    description: pr (diff against base-sha; read-only) or trusted (full assess on the default branch)
    required: true
  base-sha:
    description: Base commit of the pull request (mode pr)
    required: false
    default: ''
  full:
    description: Force a full assessment (mode trusted)
    required: false
    default: 'false'
  allow-egress:
    description: Authorize configured provider source egress (mode trusted)
    required: false
    default: 'false'
  publish:
    description: Publish scout/state after a complete run (mode trusted; needs contents write)
    required: false
    default: 'false'

outputs:
  exit-code:
    description: Scout exit code (0 clean, 1 gated, 2 incomplete, 3 unavailable)
    value: ${{ steps.run.outputs.exit_code }}
  assessment:
    description: Path of scout-assessment.json
    value: ${{ steps.run.outputs.assessment }}
  summary:
    description: Path of the Markdown summary (mode pr)
    value: ${{ steps.run.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install pinned Scout release
      shell: bash
      env:
        SCOUT_VERSION: ${{ inputs.scout-version }}
        RELEASE_REPO: ${{ inputs.release-repo }}
        DEST: ${{ runner.temp }}/scout-release
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Restore the scanner toolchain cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/scout-toolchain/tools
        key: scout-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scout-version }}

    - name: Provision the pinned scanner toolchain
      shell: bash
      env:
        SCOUT_VERSION: ${{ inputs.scout-version }}
        RELEASE_REPO: ${{ inputs.release-repo }}
        TOOLCHAIN_DIR: ${{ runner.temp }}/scout-toolchain
      run: bash "$GITHUB_ACTION_PATH/toolchain.sh"

    - name: Run Scout
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE_SHA: ${{ inputs.base-sha }}
        FULL: ${{ inputs.full }}
        ALLOW_EGRESS: ${{ inputs.allow-egress }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/scout-out"
        mkdir -p "$out"
        set +e
        case "$MODE" in
          pr)
            [[ -n "$BASE_SHA" ]] || { echo '::error::base-sha is required in mode pr.'; exit 3; }
            "$SCOUT_BIN" diff --root "$GITHUB_WORKSPACE" --clawpatch "$CLAWPATCH_BIN" \
              --base "$BASE_SHA" --baseline-remote origin --summary "$out/scout-summary.md" --json \
              > "$out/scout-assessment.json" 2> "$out/scout-assessment.stderr"
            code=$?
            ;;
          trusted)
            args=(assess --root "$GITHUB_WORKSPACE" --clawpatch "$CLAWPATCH_BIN" --json)
            [[ "$ALLOW_EGRESS" == 'true' ]] && args+=(--allow-egress)
            if git ls-remote --exit-code --heads origin scout/state > /dev/null 2>&1; then
              "$SCOUT_BIN" state restore --root "$GITHUB_WORKSPACE" --remote origin || exit 3
              [[ "$FULL" == 'true' ]] && args+=(--full)
            else
              args+=(--full)
            fi
            "$SCOUT_BIN" "${args[@]}" > "$out/scout-assessment.json" 2> "$out/scout-assessment.stderr"
            code=$?
            if [[ "$PUBLISH" == 'true' && ( "$code" == 0 || "$code" == 1 ) ]]; then
              "$SCOUT_BIN" state publish --root "$GITHUB_WORKSPACE" --remote origin --trusted || code=3
            fi
            ;;
          *) echo '::error::mode must be pr or trusted.'; exit 3 ;;
        esac
        set -e
        [[ -f "$out/scout-summary.md" ]] && cat "$out/scout-summary.md" >> "$GITHUB_STEP_SUMMARY"
        {
          printf 'exit_code=%s\n' "$code"
          printf 'assessment=%s\n' "$out/scout-assessment.json"
          printf 'summary=%s\n' "$out/scout-summary.md"
        } >> "$GITHUB_OUTPUT"
