name: Scout assessment

# Dogfood caller of the reusable guardian workflow. Scout runs from a pinned
# release, never from this checkout; see scout-guardian.yml and scout-guardian-trusted.yml for the trust model.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Force a full assessment
        required: false
        default: false
        type: boolean
      refresh-map:
        description: Force a full run that rebuilds the feature map
        required: false
        default: false
        type: boolean
      authorize-egress:
        description: Authorize configured provider source egress for this dispatch
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/scout-guardian.yml
    with:
      scout-version: v0.1.1
      release-repo: ${{ github.repository }}

  trusted:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/scout-guardian-trusted.yml
    with:
      scout-version: v0.1.1
      release-repo: ${{ github.repository }}
      full: ${{ inputs.full || false }}
      refresh-map: ${{ inputs.refresh-map || false }}
      authorize-egress: ${{ inputs.authorize-egress || false }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
