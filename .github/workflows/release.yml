name: Scout release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-release-${{ github.ref }}
  cancel-in-progress: false

# Tool versions come from toolchain/versions.env, go.mod and the third_party/clawpatch submodule
# through scripts/bootstrap-tools.sh; no version pins live in this workflow.

jobs:
  scout-binary:
    name: scout-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Build and checksum binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          asset="$RUNNER_TEMP/release/scout-${{ matrix.goos }}-${{ matrix.goarch }}"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -buildvcs=false -o "$asset" ./cmd/scout
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "$(basename "$asset")" > "$(basename "$asset").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  clawpatch-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build and checksum pinned bundle
        shell: bash
        run: |
          set -euo pipefail
          export SCOUT_TOOLS_DIR="$RUNNER_TEMP/scout-tools"
          ./scripts/bootstrap-tools.sh
          source "$SCOUT_TOOLS_DIR/activate"
          CLAWPATCH_REVISION="$(git ls-files -s third_party/clawpatch | awk '$1 == "160000" { print $2 }')"
          CLAWPATCH_VERSION="$(awk -F '=' '$1 == "CLAWPATCH_VERSION" { print $2 }' toolchain/versions.env)"
          PNPM_VERSION="$(awk -F '=' '$1 == "PNPM_VERSION" { print $2 }' toolchain/versions.env)"
          [[ "$SCOUT_CLAWPATCH_BINARY" == "$SCOUT_TOOLS_DIR/clawpatch/$CLAWPATCH_REVISION/dist/cli.js" ]] || { echo '::error::Unexpected Clawpatch build layout.'; exit 1; }
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          asset="$release_dir/clawpatch-${CLAWPATCH_VERSION}-${CLAWPATCH_REVISION}.tar.gz"
          tar -czf "$asset" -C "$SCOUT_TOOLS_DIR/clawpatch" "$CLAWPATCH_REVISION"
          asset_sha256="$(shasum -a 256 "$asset" | cut -d ' ' -f1)"
          printf '%s  %s\n' "$asset_sha256" "$(basename "$asset")" > "$asset.sha256"
          cat > "$release_dir/clawpatch-manifest.json" <<EOF
          {
            "schemaVersion": 1,
            "name": "clawpatch",
            "version": "${CLAWPATCH_VERSION}",
            "revision": "${CLAWPATCH_REVISION}",
            "node": ">=22",
            "buildNode": "$(node --version)",
            "pnpm": "${PNPM_VERSION}",
            "asset": "$(basename "$asset")",
            "entrypoint": "${CLAWPATCH_REVISION}/dist/cli.js",
            "safetyPatchSha256": "f39d73dad42b5d6701b1fee51f7784d3eb2b1548808d1ee47d8ef146ca97a865",
            "sha256": "${asset_sha256}"
          }
          EOF
          (cd "$release_dir" && shasum -a 256 clawpatch-manifest.json > clawpatch-manifest.json.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: clawpatch-bundle
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: [scout-binary, clawpatch-bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
