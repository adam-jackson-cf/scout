name: Repository gate
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Read pinned Go version
        shell: bash
        run: |
          source toolchain/versions.env
          printf 'GO_VERSION=%s\n' "$GO_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Provision and require scanner sandbox
        run: bash scripts/ci-sandbox.sh --strict
      - run: scripts/bootstrap-tools.sh
      - name: Run the repository gate
        shell: bash
        run: bash scripts/gate.sh ci
