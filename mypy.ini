[mypy]
# Supported versions, import roots and named override evidence: scripts/guardrails/python/settings.json.
python_version = 3.11
strict = True
warn_unused_ignores = True
follow_imports = skip
mypy_path = scripts/guardrails/python:scripts/guardrails
show_error_codes = True
exclude = (^evaluation/|^\.tools/|^scripts/guardrails/fixtures/|^scripts/guardrails/vendor/)
# The pinned lizard distribution has no typing metadata; no source exceptions.

[mypy-lizard]
ignore_missing_imports = True
