[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
follow_imports = normal
mypy_path = scripts/gate:internal/association/testdata/gen
show_error_codes = True
exclude = (^evaluation/|^\.tools/)
# lizard has no published stubs or py.typed; check its installed source instead.

[mypy-lizard]
follow_untyped_imports = True
