target-version = "py311"
fix = false
output-format = "full"
respect-gitignore = true
preview = true
exclude = [
    ".build",
    ".git",
    ".tox",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "node_modules",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "C901",
    "UP",
    "SIM",
    "PT",
    "PGH",
    "A",
    "N",
    "S110",
    "BLE001",
    "SIM105",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
]
ignore = ["E501", "B006", "B008", "A005"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"test_*.py" = ["S101", "PLR2004"]
"**/tests/**" = ["S101", "PLR2004"]

[lint.isort]
known-first-party = ["python_source"]
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-branches = 12
max-locals = 15
max-positional-args = 5
max-public-methods = 20
max-returns = 6
max-statements = 50

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
