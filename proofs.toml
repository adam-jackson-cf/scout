schema = 1

[scope]
mode = "whole"

[validator]
status = "proofs"
file = ".github/workflows/gate.yml"
ref = "validate_rule_coverage.py --root ."

[hooks]
check = ["git", "config", "--get", "core.hooksPath"]
expect = ".githooks"

[[claim]]
id = "gate.structure"
rules = ["STRUCT.*"]
control = ["tools/gate/structure", "tools/gate/pathscope"]

[[claim.enforced_by]]
point = "hook"
file = ".githooks/pre-commit"
ref = "go run ./tools/gate commit"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/gate.yml"
ref = "go run ./tools/gate ci"
status = "gate"

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "structure", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/structure/compliant"
violating = "tools/gate/testdata/canary/structure/reversed-import"
expect = "STRUCT.dependency-direction"
rule = "STRUCT.dependency-direction"
timeout_seconds = 120

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "structure", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/structure/compliant"
violating = "tools/gate/testdata/canary/structure/misplaced"
expect = "STRUCT.folder-placement"
rule = "STRUCT.folder-placement"
timeout_seconds = 120

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "structure", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/structure/compliant"
violating = "tools/gate/testdata/canary/structure/sibling-import"
expect = "STRUCT.sibling-isolation"
rule = "STRUCT.sibling-isolation"
timeout_seconds = 120

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "structure", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/structure/compliant"
violating = "tools/gate/testdata/canary/structure/single-reader"
expect = "STRUCT.tier-readership"
rule = "STRUCT.tier-readership"
timeout_seconds = 120

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "structure", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/structure/compliant"
violating = "tools/gate/testdata/canary/structure/single-reader"
expect = "STRUCT.single-owner-placement"
rule = "STRUCT.single-owner-placement"
timeout_seconds = 120

