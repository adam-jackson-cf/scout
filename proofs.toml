reason = "tier split of existing tests; restructure deferred"
approved_by = "owner, 2026-11-27"
expires = "2027-02-27"

[structure]
import_package = "scout"
shared_tiers = 2
prefix_cluster_min = 3
tiers = [
  ["internal/decisions/thresholds", "internal/domain", "internal/eval", "internal/guardrails", "internal/modelcli", "internal/policy", "internal/redact", "internal/sandbox", "tools/gate/proof"],
  ["internal/analyzers", "internal/artifacts", "internal/clawpatch", "internal/contextual", "internal/history", "internal/importgraph", "internal/inventory", "tools/gate/check"],
  ["internal/measures", "internal/prmeta", "internal/toolchain", "tools/gate/codeintegrity/repofile", "tools/gate/pathscope", "tools/gate/testsource", "tools/gate/basediff/scenario"],
  ["internal/areas", "tools/gate/*"],
  ["internal/decisions", "internal/state"],
  ["internal/association", "internal/baseline", "internal/decisions/orderflip", "internal/shadow", "internal/state/statetest", "internal/web"],
  ["internal/issues"],
  ["internal/engine"],
  ["cmd/scout", "tools/gate"],
]
adapter_interfaces = [
  "scout/internal/decisions.AuditStore",
  "scout/internal/decisions.Sink",
  "scout/internal/decisions/orderflip.Asker",
  "scout/internal/engine.AgentMapper",
  "scout/internal/shadow.Provider",
]

[structure.owners]
".agents/skills/" = "skills"
".claude/skills" = "skills"
".editorconfig" = "tooling"
".githooks/" = "gate"
".github/CODEOWNERS" = "review"
".github/workflows/" = "ci"
".gitignore" = "repo"
".gitleaksignore" = "secret-scan"
".gitmodules" = "repo"
".golangci.yml" = "tooling"
".prettierignore" = "tooling"
".prettierrc.json" = "tooling"
".scout/policy.yaml" = "scout-policy"
".shellcheckrc" = "tooling"
".testcoverage.yml" = "tooling"
"AGENTS.md" = "repo"
"CHANGELOG.md" = "repo"
"CLAUDE.md" = "repo"
"CONTRIBUTING.md" = "repo"
"README.md" = "repo"
"cmd/scout/" = "cli"
"docs/evidence/" = "design"
"docs/features/" = "feature-map"
"docs/hypothesis-ledger.md" = "ledgers"
"docs/jev-adapter-audit.md" = "design"
"docs/references/" = "reference-docs"
"docs/research-ledger.md" = "ledgers"
"docs/scout-design.html" = "design"
"evaluation/" = "studies"
"go.mod" = "repo"
"go.sum" = "repo"
"internal/analyzers/" = "analyzers"
"internal/areas/" = "areas"
"internal/artifacts/" = "artifacts"
"internal/association/" = "association"
"internal/baseline/" = "baseline"
"internal/clawpatch/" = "clawpatch"
"internal/contextual/" = "contextual"
