timeout_seconds = 60

[[claim]]
id = "host.required-checks"
rules = ["GIT.required-checks"]

[claim.host]
command = ["gh", "api", "repos/adam-jackson-cf/scout/branches/main/protection"]
expect = ["\"gate\"", "\"proofs\""]

[[claim]]
id = "test.evidence"
rules = ["TEST.placement", "TEST.growth.justified", "TEST.duplicate-path", "TEST.subprocess-timeouts", "TEST.no-self-mocking", "TEST.no-test-hooks", "TEST.no-evasion", "TEST.tier-selectors", "TEST.failure-propagation", "TEST.t1-isolation", "TEST.user-data-guard"]
control = ["tools/gate/testsource", "tools/gate/testrun"]

[[claim.enforced_by]]
point = "hook"
file = ".githooks/pre-commit"
ref = "go run ./tools/gate commit"

[[claim.enforced_by]]
point = "ci"
file = ".github/workflows/gate.yml"
ref = "go run ./tools/gate ci"
status = "gate"

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "test.placement", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/test-placement/compliant"
violating = "tools/gate/testdata/canary/test-placement/violating"
expect = "TEST.placement: test file sits in a directory with no package code to own it"
rule = "TEST.placement"
timeout_seconds = 60

[[claim.canary]]
command = ["go", "run", "./tools/gate", "ci", "--only", "test.growth", "--path", "{fixture}"]
passing = "tools/gate/testdata/canary/test-growth/compliant"
violating = "tools/gate/testdata/canary/test-growth/violating"
expect = "TEST.growth.justified: new test TestTotal does not name the behaviour it proves"
rule = "TEST.growth.justified"
timeout_seconds = 60

[[claim.canary]]
