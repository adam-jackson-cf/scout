"internal/domain/" = "domain"
"internal/engine/" = "engine"
"internal/eval/" = "eval"
"internal/guardrails/" = "guardrails"
"internal/history/" = "history"
"internal/importgraph/" = "importgraph"
"internal/inventory/" = "inventory"
"internal/issues/" = "issues"
"internal/measures/" = "measures"
"internal/modelcli/" = "modelcli"
"internal/policy/" = "policy"
"internal/prmeta/" = "prmeta"
"internal/redact/" = "redact"
"internal/sandbox/" = "sandbox"
"internal/shadow/" = "shadow"
"internal/state/" = "state"
"internal/state/statetest/" = "state-statetest"
"internal/toolchain/" = "toolchain"
"internal/web/" = "web"
"mypy.ini" = "tooling"
"proofs.toml" = "proofs"
"ruff.toml" = "tooling"
"scripts/" = "toolchain"
"third_party/" = "vendored"
"toolchain/" = "toolchain"
"tools/gate/" = "gate"
"tools/validate_rule_coverage.py" = "proofs"

[layout]
exclude = ["evaluation/**", "third_party/**", ".tools/**", "tools/gate/testdata/**", "tools/validate_rule_coverage.py"]
canary_dir = "tools/gate/testdata/canary"
golden_files = ["internal/association/testdata/parity-*.json.gz", "internal/association/testdata/replay-*-gold.jsonl", "internal/association/testdata/replay-*-scores.jsonl", "internal/association/testdata/replay-*-units.jsonl", "internal/association/testdata/terra-replay.jsonl", "evaluation/reference-v1.json", "evaluation/scout-requests-v2.json", "evaluation/change-cost-v2/**"]
change_record = "CHANGELOG.md"
support_dir = "internal/state/statetest"
fixtures_dir = "testdata"

[layout.skills]
root = ".agents/skills"
allowed = ["SKILL.md", "README.md", "references/*.md", "assets/**", "scripts/**"]
frontmatter_required = ["name", "description"]
frontmatter_allowed = ["name", "description", "hide", "disable-model-invocation"]

[layout.test_tiers]
boundary_tag = "boundary"
deferred_tag = "deferred"
package_timeout = "300s"

[surface]
feature_map_path = "docs/features"
feature_map_index = "README.md"
lever_command = ["go", "run", "./cmd/scout"]

[identity_artefacts]
"internal/association/terra_prompt.txt" = "the measured Terra prompt bytes TerraPromptDigest pins"
"internal/association/terra.go" = "holds TerraPromptDigest, the digest of the measured Terra prompt"
"scripts/clawpatch-safe.patch" = "hashed by scripts/build-clawpatch.sh, internal/clawpatch/review.go and release.yml"
"toolchain/checksums.sha256" = "pinned download digests"

[python_quality]
maintained_roots = ["internal/association/testdata/gen", "tools/gate/codeintegrity", "tools/gate/pyquality"]
script_roots = ["internal/association/testdata/gen", "tools/gate/codeintegrity", "tools/gate/pyquality"]
script_names = ["parity-fixtures.py", "inspect-python-source.py", "check-python-quality.py", "check-python-scalability.py", "check-python-fanout.py", "python_source.py"]
test_roots = []
test_groups = []
generic_name_allowlist = []
class_max_lines = 700
class_max_init_args = 8
class_max_instance_attributes = 12
subprocess_wrappers = {}
dynamic_import_adapters = ["internal/association/testdata/gen/parity-fixtures.py"]
contract_files = ["internal/association/testdata/gen/parity-fixtures.py", "tools/gate/pyquality/python_source.py", "tools/gate/pyquality/check-python-quality.py", "tools/gate/pyquality/check-python-scalability.py", "tools/gate/pyquality/check-python-fanout.py", "tools/gate/codeintegrity/inspect-python-source.py"]
max_loop_depth = 2
fanout_max = 10
large_module_nloc = 800
large_module_fanout_max = 3

[[test_budget.machine]]
id = "darwin-arm64-apple-m5-pro-go1-26-11"
wall_limit_s = 120
per_test_limit_s = 3
approval = "owner, 2026-11-27 (provisional until the first measure run)"
